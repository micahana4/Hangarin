{% extends 'base.html' %}

{% block content %}
    <div class="content">
        <div class="container-fluid">
            <h4 class="page-title">Categories</h4>

            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">List of Categories</div>
                            <div class="card-category">Page Subtitle</div>
                        </div>
                        <div class="list-controls">
                            <form class="list-search nav-search" action="{% url 'category-list' %}">
                                <div class="input-group">
                                    <input type="text" placeholder="Search ..." class="form-control" name="q" />
                                    <div class="input-group-append">
                                        <span class="input-group-text">
                                            <i class="la la-search search-icon"></i>
                                        </span>
                                    </div>
                                </div>
                            </form>
                            <a href="{% url 'category-add' %}" class="btn btn-success btn-rounded list-add-button">Add Category</a>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                            <table class="table table-striped mt-3">
                                <thead>
                                    <tr>
                                        <th scope="col">Name</th>
                                        <th scope="col">Actions</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    {% for object in object_list %}
                                        <tr>
                                            <td>{{ object.name }}</td>
                                            <td>
                                                <a href="{% url 'category-update' object.id %}">Edit</a>
                                                <a href="{% url 'category-delete' object.id %}" class="text-danger">Delete</a>
                                            </td>
                                        </tr>
                                        {% empty %}
                                        <tr>
                                            <td colspan="7" style="text-align: center">
                                                <p class="text-sm font-weight-bold mb-0">No Categories Found.</p>
                                            </td>
                                        </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                            </div>
                            {% include 'includes/pagination.html' %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
